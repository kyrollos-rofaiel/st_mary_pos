<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام متطور وشامل لإدارة المخازن ونقاط البيع والفواتير الضريبية - مكتبة العذراء والبابا كيرلس">

  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="514147137072-qi2qk3jqu6mbp6ejlnhi7otjm64ubcou.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مكتبة العذراء والبابا كيرلس">
  <link rel="apple-touch-icon" id="apple-touch-icon" href="Dark_logo.png">

  <!-- Favicon based on system theme (Dark / Light) -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="Light_logo.png">
  <link rel="icon" type="image/png" href="Dark_logo.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="Light_logo.png" media="(prefers-color-scheme: light)">

  <title>مكتبة العذراء والبابا كيرلس - نظام إدارة المخازن والمبيعات</title>
  <link rel="manifest" href="manifest.json">

  <!-- Dynamic System Theme Favicon Switcher -->
  <script>
    (function() {
      function updateFaviconForSystemTheme() {
        var isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var logoUrl = isDarkMode ? 'Dark_logo.png' : 'Light_logo.png';

        // 1. Update dynamic favicon link
        var dynamicFavicon = document.getElementById('dynamic-favicon');
        if (dynamicFavicon) {
          dynamicFavicon.href = logoUrl;
        }

        // 2. Update general favicon links without media queries
        var icons = document.querySelectorAll("link[rel*='icon']");
        icons.forEach(function(icon) {
          if (!icon.hasAttribute('media')) {
            icon.href = logoUrl;
          }
        });

        // 3. Update Apple touch icon
        var appleIcon = document.getElementById('apple-touch-icon');
        if (appleIcon) {
          appleIcon.href = logoUrl;
        }
      }

      // Run immediately on page load
      updateFaviconForSystemTheme();

      // Listen to OS / Browser theme change dynamically
      if (window.matchMedia) {
        var matcher = window.matchMedia('(prefers-color-scheme: dark)');
        if (matcher.addEventListener) {
          matcher.addEventListener('change', function() {
            updateFaviconForSystemTheme();
          });
        } else if (matcher.addListener) {
          matcher.addListener(function() {
            updateFaviconForSystemTheme();
          });
        }
      }

      // Expose to window for manual triggering
      window.updateThemeFavicon = updateFaviconForSystemTheme;
      window.setAppFavicon = function(isDark) {
        var logoUrl = isDark ? 'Dark_logo.png' : 'Light_logo.png';
        var dynamicFavicon = document.getElementById('dynamic-favicon');
        if (dynamicFavicon) dynamicFavicon.href = logoUrl;
        var appleIcon = document.getElementById('apple-touch-icon');
        if (appleIcon) appleIcon.href = logoUrl;
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
